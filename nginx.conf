server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json
              image/svg+xml application/wasm;
  gzip_min_length 1024;

  # Cache long terme pour les assets hashés par Angular
  location ~* \.(js|css|woff2?|ttf|ico|png|svg|webp)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
  }

  # Cache pour les animations Lottie (JSON non hashés → revalidation possible)
  location /anos/lottie-animations/ {
    alias /usr/share/nginx/html/anos/lottie-animations/;
    expires 7d;
    add_header Cache-Control "public, stale-while-revalidate=86400";
    access_log off;
  }

  # SPA routing avec baseHref /material-test/
  location /material-test/ {
    alias /usr/share/nginx/html/material-test/;
    try_files $uri $uri/ /material-test/index.html;
  }

  # Redirection racine vers /material-test/
  location = / {
    return 301 /material-test/;
  }

  # Bloquer l'accès aux fichiers cachés
  location ~ /\. {
    deny all;
  }
}
