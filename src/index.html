<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Material test</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="preload" href="/fonts/google/roboto.woff2" as="font" type="font/woff2" crossorigin />
    <link
      rel="preload"
      href="/fonts/google/material-icons.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <script>
      (function () {
        const stored = localStorage.getItem('theme');

        const isDark = stored
          ? stored === 'dark'
          : window.matchMedia('(prefers-color-scheme: dark)').matches;

        if (isDark) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  <body>
    <app-root></app-root>
  </body>
</html>
