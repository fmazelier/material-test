<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Material test</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <script>
      (function () {
        const stored = localStorage.getItem('theme');

        const isDark = stored
          ? stored === 'dark'
          : window.matchMedia('(prefers-color-scheme: dark)').matches;

        if (isDark) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <app-root>
      <div class="bg-surface flex h-dvh items-center justify-center">
        <div
          class="border-primary/20 border-t-primary size-10 animate-spin rounded-full border-[3px]"
        ></div>
      </div>
    </app-root>
  </body>
</html>
