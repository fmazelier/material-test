<form [formGroup]="userForm" class="p-8 max-w-md mx-auto flex flex-col gap-4">

  <mat-form-field appearance="outline" class="w-full">
    <mat-label>Votre CV (PDF)</mat-label>

    <app-file-control
      formControlName="cv"
      accept=".pdf"
      placeholder="Cliquer ou glisser ici..."
    ></app-file-control>

    <mat-icon matPrefix class="mr-2 text-gray-400">description</mat-icon>
    <mat-hint>Max 5 Mo</mat-hint>

    @if (userForm.get('cv')?.hasError('required')) {
      <mat-error>Le CV est obligatoire</mat-error>
    }
  </mat-form-field>

  <mat-form-field appearance="fill" class="w-full">
    <mat-label>Photos du projet</mat-label>
    <app-file-control formControlName="photos" [multiple]="true" accept="image/*"></app-file-control>
  </mat-form-field>

</form>
