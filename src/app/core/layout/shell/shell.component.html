<header>
  <mat-toolbar class="w-full px-2!">
    <button matIconButton (click)="updateSidenavState()" aria-label="Toggle sidebar">
      <mat-icon>menu</mat-icon>
    </button>

    <h1>AnOS PDF Transformation</h1>

    <div class="flex-1"></div>

    <button matIconButton aria-label="Toggle theme" (click)="themeService.toggle()">
      @if (themeService.isDark()) {
        <mat-icon>light_mode</mat-icon>
      } @else {
        <mat-icon>dark_mode</mat-icon>
      }
    </button>
  </mat-toolbar>
</header>

<mat-sidenav-container class="flex-1">
  <mat-sidenav
    opened
    [mode]="isMobile() ? 'over' : 'side'"
    [class.collapsed]="!isMobile() && isCollapsed()"
    [fixedInViewport]="isMobile()"
    fixedTopGap="56"
  >
    <mat-nav-list>
      @for (link of navLinks; track link.href) {
        <a
          mat-list-item
          [routerLink]="link.href"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
        >
          <mat-icon matListItemIcon>{{ link.icon }}</mat-icon>
          <span matListItemTitle>{{ link.label }}</span>
        </a>
      }
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content
    [class.collapsed]="!isMobile() && isCollapsed()"
    [class.expanded]="!isMobile() && !isCollapsed()"
  >
    <main class="mx-auto min-h-full max-w-400 flex flex-col">
      <div class="p-4 flex-1">
        <router-outlet />
      </div>

      <app-footer />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
